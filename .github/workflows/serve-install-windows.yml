# serve-install REAL-MACHINE integration test (Plan 15 T8, FINDING C root-cause fix).
#
# WHY THIS WORKFLOW EXISTS
#
# Plan 14 §7.2 specified a gated integration test for `serve install` → status
# → uninstall on a real Windows Task Scheduler. The gate (SSHMGR_SERVE_INSTALL=1)
# defaulted to skip AND was never wired into CI. Every serve-install bug Plan 15
# exists to fix (FINDING C: broken XML registration chain; FINDING D: Restart
# OnFailure not persisted; FINDING E: zh-CN /Query locale misparse; the sentinel-
# write path under real ACLs) hid behind that never-run gate until NUC10 §7.3
# manual acceptance blew them open.
#
# This workflow is the root-cause fix: it runs the gated test on EVERY push/PR
# that touches serve_install / dpapi / masterkey (or this workflow itself), on a
# real windows-latest runner with a real Task Scheduler. The gate still defaults
# to skip locally so `go test ./...` stays hermetic — CI sets the env to open it.
#
# WHAT IT PROVES (spec §7.2, full round-trip):
#   - step 0: non-interactively seed a vault (master.key + sentinel + store.db
#     + 1 test server).
#   - step 1: `serve install` registers a Task Scheduler task via the object
#     API (FINDING C fix).
#   - step 2-6: Get-ScheduledTask.State == Ready, MultipleInstances == IgnoreNew
#     (pi #2 / spike 4), schtasks /Run → HTTP 401 (auth gate wired), vault
#     decryptable in the task-host session (no hard-fail marker in serve.log),
#     serve status four signals present, serve uninstall removes the task.
#
# === USER FOLLOW-UP REQUIRED (cannot be done from this workflow) ===
#
# The test needs a Windows account password to register the task with
# LogonType=Password (so it can start at boot, headless). The workflow creates a
# throwaway local user `sshmgrci` with the password from GitHub secret
# SSHMGR_CI_PASSWORD. UNTIL THE USER CONFIGURES THAT SECRET in repo settings
# (Settings → Secrets and variables → Actions → New repository secret), CI runs
# will fail at the test's password-required gate. That is EXPECTED — the workflow
# is correct; the secret is a one-time setup. See Plan 15 T8 report.
#
# SCOPE / NON-GOALS
#
#   - Per spec §7.2 opencode #2: this is a "machine-scope regression test +
#     serve-install registration-path verification," NOT the FINDING B (cross
#     logon-session) closure. The FINDING B closure needs a real reboot, which
#     GitHub-hosted runners cannot do — that stays in the NUC10 §7.3 manual
#     runbook (release-time human checklist).
#   - The test surfaces real-machine issues (R1 RestartOnFailure persistence on
#     the runner's PS version, sentinel write under the runner's ACL, locale on
#     the runner image). A failure here IS the value — it's the gate finally
#     doing its job.
name: serve-install-windows

on:
  push:
    branches: [master]
    paths:
      - 'internal/cli/serve_install*.go'
      - 'internal/cli/serve.go'
      - 'internal/store/dpapi*.go'
      - 'internal/store/masterkey*.go'
      - 'internal/cli/serve_install_integration_test.go'
      - '.github/workflows/serve-install-windows.yml'
  pull_request:
    paths:
      - 'internal/cli/serve_install*.go'
      - 'internal/cli/serve.go'
      - 'internal/store/dpapi*.go'
      - 'internal/store/masterkey*.go'
      - 'internal/cli/serve_install_integration_test.go'
      - '.github/workflows/serve-install-windows.yml'

permissions:
  contents: read

# One serve-install integration run per ref at a time. cancel-in-progress on a
# PR superseded by a newer push to the same branch; do NOT cancel release-track
# (master push) runs mid-flight (a half-registered task would leak).
concurrency:
  group: serve-install-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Build the ssh-manager.exe the integration test will install as the task
      # action. Resolves to ./ssh-manager.exe at the repo root; the test's
      # resolveSSHManagerBin walks up from the test working dir to find it.
      - name: Build ssh-manager.exe
        run: go build -o ssh-manager.exe ./cmd/ssh-manager

      # Cross-platform no-regression (spec §7.4): the test file is //go:build
      # windows, but a Linux/Darwin build must stay clean (the package compiles
      # with serve_install_other.go on non-Windows).
      #
      # shell: bash is REQUIRED. windows-latest `run:` defaults to pwsh
      # (PowerShell), where `GOOS=linux go build ...` is parsed as "run the
      # command named GOOS=linux" → "term not found" → CI fails before the gated
      # test even runs (T8 review: BLOCKING). Windows runners ship Git Bash, so
      # `shell: bash` gives us POSIX `VAR=value command` semantics. `gofmt -l .`
      # is shell-agnostic (it's a Go binary) but rides along on the same step.
      - name: Cross-platform build (no-regression)
        shell: bash
        run: |
          gofmt -l .
          GOOS=linux go build ./...
          GOOS=darwin go build ./...

      # Create the throwaway local user the registered task will run as. The
      # password comes from GitHub secret SSHMGR_CI_PASSWORD (user-configured).
      # /passwordreq:no lets the account have a non-blank password without
      # forcing a change at next logon (headless task host never logs on
      # interactively, so the prompt would never be answered).
      #
      # SeBatchLogonRight (pi #1): Register-ScheduledTask with LogonType=Password
      # needs the task principal to have "Log on as a batch job" right. On a
      # fresh runner the user does not have it by default. We grant it via
      # secedit: export the current cfg, splice the right into the user-rights
      # assignment, re-import. This is the canonical way to grant a Windows
      # right to a principal from a script (no GUI, no GroupPolicy module).
      #
      # REGEX CAVEAT (T8 review, non-blocking — leave for first real CI run):
      # the `-replace '^SeBatchLogonRight = .*', ...` assumes the secedit export
      # contains that line verbatim with that exact spacing. If the first real
      # CI run shows the right ISN'T granted (Register-ScheduledTask fails with
      # access-denied at step 1), this regex is the prime suspect — the windows-
      # latest runner image may format the line differently (different spacing,
      # different casing, or the line absent if no principal currently holds the
      # right). NOT pre-fixed; let real CI confirm before tweaking.
      #
      # Secret-not-set fast-fail (T8 review): when SSHMGR_CI_PASSWORD is empty,
      # emit the ::warning:: AND exit 1 here. Otherwise `net user /add` would
      # create an empty-password account and the failure mode would be "test
      # fatals at its password gate" — less clean than "secret not configured."
      # The step also writes `secret_present=false` to GITHUB_OUTPUT so the
      # downstream test step's `if:` can no-op (belt-and-suspenders — the exit 1
      # already fails the job, but the gate keeps the test from running at all
      # if the exit is ever loosened to a warning).
      - name: Create test user + grant SeBatchLogonRight
        id: sshmgr_ci_user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = '${{ secrets.SSHMGR_CI_PASSWORD }}'
          if ([string]::IsNullOrEmpty($pw)) {
            Write-Output "::warning::SSHMGR_CI_PASSWORD secret is not set. The serve-install integration test cannot run without it (the registered task needs LogonType=Password). Configure the secret in repo settings (Settings -> Secrets and variables -> Actions). Aborting job cleanly."
            Write-Output "secret_present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 1
          }
          # Create the user. /add creates; /passwordreq:no avoids a forced change.
          net user sshmgrci $pw /add /passwordreq:no /expires:never /y
          # Grant SeBatchLogonRight via secedit (pi #1). Export current policy,
          # replace the SeBatchLogonRight line so sshmgrci owns it, re-import.
          $cfg = Join-Path $env:RUNNER_TEMP 'secpol.cfg'
          $db  = Join-Path $env:RUNNER_TEMP 'secpol.sdb'
          secedit /export /cfg $cfg /quiet
          (Get-Content $cfg) -replace '^SeBatchLogonRight = .*', "SeBatchLogonRight = *sshmgrci" | Set-Content $cfg
          secedit /configure /db $db /cfg $cfg /quiet
          Write-Output "secret_present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Run the gated integration test. SSHMGR_SERVE_INSTALL=1 OPENS the gate
      # (local `go test ./...` skips it). SSHMGR_SERVE_INSTALL_PASSWORD hands
      # the account password to readServeInstallPassword (consensus A: env
      # first → stdin → Register-ScheduledTask -Password; never on argv, never
      # in the Windows 4688 audit log).
      #
      # The test isolates %AppData%/%LocalAppData% to per-test temp dirs so a
      # prior run's vault does not poison the assertions, and t.Cleanup
      # uninstalls the task so a mid-test failure does not leak a boot task.
      #
      # Skipped when the user-creation step aborted (secret unset). Belt-and-
      # suspenders: the secret-empty branch already exits 1, but if that is
      # ever loosened, this `if:` keeps the test from running with an empty
      # password env (which would fatal inside the test rather than no-op).
      - name: Run serve-install integration test
        if: ${{ steps.sshmgr_ci_user.outputs.secret_present == 'true' }}
        env:
          SSHMGR_SERVE_INSTALL: '1'
          SSHMGR_SERVE_INSTALL_PASSWORD: ${{ secrets.SSHMGR_CI_PASSWORD }}
        run: go test ./internal/cli/ -run TestServeInstallIntegration -v

      # Always uninstall whatever the test left behind. t.Cleanup inside the
      # test handles the normal path; this is belt-and-suspenders for the case
      # where the test PANICKED before t.Cleanup ran (e.g. a Fatal in a
      # goroutine). Best-effort; do not fail the job on cleanup errors.
      - name: Cleanup leftover task (best-effort)
        if: always()
        shell: powershell
        run: |
          try { schtasks /Delete /TN ssh-manager-serve /F } catch {}
          exit 0
