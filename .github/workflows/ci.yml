# Test baseline — every push/PR, both lanes. Also the reusable gate the
# release pipeline calls (release.yml `needs` this workflow's test job), so a
# v* tag is published only after the SAME matrix passes on the tag commit.
# Windows lane is load-bearing: 4 `//go:build windows` test files
# (store/acl, store/dpapi, store/masterkey, tui/istty) never run on ubuntu.
name: ci

on:
  push:
    # branches-only filter: tag pushes do NOT trigger a standalone ci run —
    # they reach this workflow via release.yml's workflow_call, and both runs
    # would share the ci-${{ github.ref }} concurrency group (one would
    # cancel-in-progress the release's own gate). PRs + master pushes run
    # standalone; v* tags run only as the release gate.
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt (fail on output)
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      # Plan 45 终审残留:tui 配对向导 + clientops PairSession 新增的
      # goroutine/chan/ctx 并发面在 race 检测下跑(-race 最有价值的两包;
      # scoped 而非全仓,避免 Windows lane 时长爆炸)。本机 Windows 开发环境
      # 的 -race 运行时 DLL 损坏(STATUS_ENTRYPOINT_NOT_FOUND,任何包都失败)
      # ——race 门只能活在 CI,两 OS lane 都跑。
      - name: Test (race, scoped to the concurrent pair pipeline)
        run: go test -race ./internal/tui/ ./internal/clientops/ -count=1
